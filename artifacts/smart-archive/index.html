<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>أرشيف ذكي</title>
    <meta name="description" content="نظام إدارة الأرشيف الذكي لرواد الأعمال والمقاولين" />
    <meta name="theme-color" content="#1E40AF" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="أرشيف ذكي" />
    <meta property="og:description" content="نظام إدارة الأرشيف الذكي لرواد الأعمال والمقاولين" />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    /* Hide GT toolbar & badge */
    .goog-te-banner-frame, .goog-te-ftab-float, #goog-gt-tt,
    .skiptranslate > iframe, body > .skiptranslate { display:none !important; }
    body { top: 0 !important; }
  </style>
</head>
  <body>
    <div id="google_translate_element" style="display:none;position:absolute;"></div>
    <div id="root"></div>
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'ar',
          includedLanguages: 'en,ar',
          autoDisplay: false
        }, 'google_translate_element');
      }
      window.__gtSwitchLang = function(lang) {
        var sel = document.querySelector('.goog-te-combo');
        if (!sel) return;
        sel.value = lang;
        sel.dispatchEvent(new Event('change'));
      };
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
