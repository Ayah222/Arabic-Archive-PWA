<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>أرشيف ذكي</title>
    <meta name="description" content="نظام إدارة الأرشيف الذكي لرواد الأعمال والمقاولين" />
    <meta name="theme-color" content="#1E40AF" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="أرشيف ذكي" />
    <meta property="og:description" content="نظام إدارة الأرشيف الذكي لرواد الأعمال والمقاولين" />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />

    <!-- ── Google Translate: hide the default toolbar ── -->
    <style>
      .goog-te-banner-frame, .skiptranslate { display: none !important; }
      body { top: 0 !important; }
      .goog-te-gadget { height: 0 !important; overflow: hidden !important; }
      #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
      font { background-color: transparent !important; box-shadow: none !important; }
    </style>
  </head>
  <body>
    <!-- Hidden Google Translate mount point -->
    <div id="google_translate_element" style="display:none;position:absolute;top:-9999px"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Translate Widget init -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'ar',
          includedLanguages: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
  </body>
</html>
