kind = "web"
previewPath = "/"
title = "نظام إدارة الأرشيف المعماري"
version = "1.0.0"
id = "artifacts/arch-archive"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18625

[services.development]
run = "pnpm --filter @workspace/arch-archive run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arch-archive", "run", "build" ]
publicDir = "artifacts/arch-archive/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18625"
BASE_PATH = "/"
