openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Smart Archive API - أرشيف ذكي
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: projects
  - name: contracts
  - name: contractors
  - name: documents
  - name: meetings
  - name: letters
  - name: upload
  - name: voice
  - name: notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sa/dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /sa/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List all notifications
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /sa/notifications/{nid}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: nid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadInput"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /sa/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Projects list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /sa/projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /sa/projects/{id}/contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List contracts for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contracts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Create a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Created contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /sa/projects/{id}/contracts/{cid}:
    patch:
      operationId: updateContract
      tags: [contracts]
      summary: Update a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractUpdate"
      responses:
        "200":
          description: Updated contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
    delete:
      operationId: deleteContract
      tags: [contracts]
      summary: Delete a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /sa/projects/{id}/contractors:
    get:
      operationId: listProjectContractors
      tags: [contractors]
      summary: List contractors for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contractors list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectContractor"
    post:
      operationId: createProjectContractor
      tags: [contractors]
      summary: Add a contractor to a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectContractorInput"
      responses:
        "201":
          description: Created contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectContractor"

  /sa/projects/{id}/contractors/{cid}:
    patch:
      operationId: updateProjectContractor
      tags: [contractors]
      summary: Update a project contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectContractorUpdate"
      responses:
        "200":
          description: Updated contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectContractor"
    delete:
      operationId: deleteProjectContractor
      tags: [contractors]
      summary: Remove contractor from project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /sa/projects/{id}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Documents list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a document record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /sa/projects/{id}/documents/{did}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: did
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /sa/projects/{id}/meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List meetings for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Meetings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Create a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingInput"
      responses:
        "201":
          description: Created meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  /sa/projects/{id}/meetings/{mid}:
    patch:
      operationId: updateMeeting
      tags: [meetings]
      summary: Update a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: mid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingUpdate"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
    delete:
      operationId: deleteMeeting
      tags: [meetings]
      summary: Delete a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: mid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /sa/projects/{id}/letters:
    get:
      operationId: listLetters
      tags: [letters]
      summary: List letters for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Letters list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Letter"
    post:
      operationId: createLetter
      tags: [letters]
      summary: Create a letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LetterInput"
      responses:
        "201":
          description: Created letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Letter"

  /sa/projects/{id}/letters/{lid}:
    delete:
      operationId: deleteLetter
      tags: [letters]
      summary: Delete a letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /sa/upload:
    post:
      operationId: uploadFile
      tags: [upload]
      summary: Upload a file (image or PDF)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /sa/voice:
    post:
      operationId: processVoice
      tags: [voice]
      summary: Process a voice command (text extracted from audio)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceInput"
      responses:
        "200":
          description: Voice processing result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Dashboard:
      type: object
      properties:
        totalProjects:
          type: integer
        activeProjects:
          type: integer
        completedProjects:
          type: integer
        onHoldProjects:
          type: integer
        totalContracts:
          type: integer
        totalDocuments:
          type: integer
        totalMeetings:
          type: integer
        totalLetters:
          type: integer
        recentProjects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        unreadNotifications:
          type: integer
      required:
        - totalProjects
        - activeProjects
        - completedProjects
        - onHoldProjects
        - totalContracts
        - totalDocuments
        - totalMeetings
        - totalLetters
        - recentProjects
        - unreadNotifications

    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [reminder, info, warning, success]
        scheduledAt:
          type: ["string", "null"]
        read:
          type: boolean
        projectId:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, title, message, type, read, createdAt]

    NotificationReadInput:
      type: object
      properties:
        read:
          type: boolean
      required: [read]

    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        client:
          type: string
        status:
          type: string
          enum: [active, completed, on_hold, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        budget:
          type: ["number", "null"]
        location:
          type: ["string", "null"]
        coverImage:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - description
        - client
        - status
        - progress
        - startDate
        - createdAt
        - updatedAt

    ProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        client:
          type: string
          minLength: 1
        status:
          type: string
          enum: [active, completed, on_hold, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        budget:
          type: ["number", "null"]
        location:
          type: ["string", "null"]
        coverImage:
          type: ["string", "null"]
      required: [name, description, client, status, progress, startDate]

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        client:
          type: string
        status:
          type: string
          enum: [active, completed, on_hold, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        budget:
          type: ["number", "null"]
        location:
          type: ["string", "null"]
        coverImage:
          type: ["string", "null"]

    Contract:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        party:
          type: string
        value:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        status:
          type: string
          enum: [active, completed, pending, cancelled]
        notes:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, projectId, title, party, value, startDate, endDate, status, createdAt]

    ContractInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        party:
          type: string
          minLength: 1
        value:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        status:
          type: string
          enum: [active, completed, pending, cancelled]
        notes:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
      required: [title, party, value, startDate, endDate, status]

    ContractUpdate:
      type: object
      properties:
        title:
          type: string
        party:
          type: string
        value:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        status:
          type: string
          enum: [active, completed, pending, cancelled]
        notes:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]

    ProjectContractor:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        specialty:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, projectId, name, specialty, status, createdAt]

    ProjectContractorInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        specialty:
          type: string
          minLength: 1
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        notes:
          type: ["string", "null"]
      required: [name, specialty, status]

    ProjectContractorUpdate:
      type: object
      properties:
        name:
          type: string
        specialty:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        notes:
          type: ["string", "null"]

    Document:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [pdf, image, word, excel, other]
        url:
          type: string
        size:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, projectId, name, type, url, createdAt]

    DocumentInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [pdf, image, word, excel, other]
        url:
          type: string
        size:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
      required: [name, type, url]

    Meeting:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        date:
          type: string
        location:
          type: ["string", "null"]
        attendees:
          type: array
          items:
            type: string
        agenda:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, projectId, title, date, attendees, createdAt]

    MeetingInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        date:
          type: string
        location:
          type: ["string", "null"]
        attendees:
          type: array
          items:
            type: string
        agenda:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required: [title, date, attendees]

    MeetingUpdate:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        location:
          type: ["string", "null"]
        attendees:
          type: array
          items:
            type: string
        agenda:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    Letter:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        subject:
          type: string
        direction:
          type: string
          enum: [incoming, outgoing]
        from:
          type: string
        to:
          type: string
        date:
          type: string
        reference:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, projectId, subject, direction, from, to, date, createdAt]

    LetterInput:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
        direction:
          type: string
          enum: [incoming, outgoing]
        from:
          type: string
          minLength: 1
        to:
          type: string
          minLength: 1
        date:
          type: string
        reference:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
      required: [subject, direction, from, to, date]

    FileUploadInput:
      type: object
      properties:
        filename:
          type: string
        mimetype:
          type: string
        projectId:
          type: string
        section:
          type: string
      required: [filename, mimetype, projectId, section]

    UploadResult:
      type: object
      properties:
        url:
          type: string
        filename:
          type: string
        size:
          type: integer
        mimetype:
          type: string
      required: [url, filename, size, mimetype]

    VoiceInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        projectId:
          type: ["string", "null"]
      required: [text]

    VoiceResult:
      type: object
      properties:
        action:
          type: string
          enum: [reminder, search, add, unknown]
        message:
          type: string
        data:
          type: object
          additionalProperties: true
      required: [action, message, data]
